name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock', 'config/**') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - name: Install package tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch locked dependencies
        run: mix deps.get --check-locked
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check source, tests, browser flows, and assets
        run: just ci
      - name: Preserve browser report, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production release
        run: just release

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build deployment image
        run: docker build --tag breakthrough:ci .
      - name: Boot production image and verify HTTP health
        run: |
          trap 'docker logs breakthrough-smoke; docker rm --force breakthrough-smoke' EXIT
          docker run --detach --name breakthrough-smoke \
            --publish 127.0.0.1:4801:4000 \
            --env PHX_SERVER=true --env PHX_HOST=localhost --env PORT=4000 \
            --env SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            --env FLY_APP_NAME=breakthrough --env FLY_MACHINE_ID=ci-smoke \
            --env FLY_PRIVATE_IP=::1 \
            --env FLY_IMAGE_REF=registry.fly.io/breakthrough@sha256:example \
            breakthrough:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --retry-max-time 45 --max-time 5 http://127.0.0.1:4801/ > /dev/null
